name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Chỉ cài runtime backend (không torch/sentence-transformers) + streamlit cho test UI
      - name: Install dependencies
        run: |
          pip install -r requirements-backend.txt
          pip install "streamlit>=1.38.0"

      - name: Run tests
        run: python -m pytest tests/ -v -m "not heavy"
