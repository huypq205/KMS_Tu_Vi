# ============ Các section KHÔNG phải cách cục nhận diện được (3-10) ============
# P2 chỉ kiểm kê 30 quy tắc section 1-2. Các section sau được khai báo để
# không bị âm thầm bỏ qua; item nhạy cảm gắn nhãn để P2 §4.5 chặn đúng.
sections_khong_phan_van:
  - ma: 3
    ten: "Đắc Địa theo 12 Cung"
    ly_do: "Chuẩn tắc luận theo cung (Mệnh an cung nào sao nào đẹp), chưa tách thành điều kiện nhận diện riêng."
    noi_dung_nhay_cam: false
    ghi_chu: "Chiến dịch 'Mệnh an tại cung nào' có thể tách sau P2b."
  - ma: 4
    ten: "Thất Hãm theo 12 Cung"
    ly_do: "Ghép nhiều sao theo từng cung, chưa tách điều kiện; kèm luận yểu chiết."
    noi_dung_nhay_cam: true
    ghi_chu: "Chứa luận yểu chiết - phải duyệt nội dung trước khi dùng (P2 §4.5)."
  - ma: 5
    ten: "Cốt Tủy Phú - Nguyên tắc vàng"
    ly_do: "Nguyên tắc luận giải chung (thứ tự xem, sinh khắc, hung cát), không phải điều kiện nhận diện sao-cung."
    noi_dung_nhay_cam: false
    ghi_chu: "Dùng làm khung quy tắc cho P3/P6, không phải quy tắc cách cục."
  - ma: 6
    ten: "Luận Đại Hạn"
    ly_do: "Nguyên tắc diễn giải theo đại hạn (P6 phạm vi), cần kết hợp Mệnh + Hạn."
    noi_dung_nhay_cam: false
    ghi_chu: ""
  - ma: 7
    ten: "Luận Lưu Niên"
    ly_do: "Danh sách thần lưu niên (Thái Tuế 12 thần, vòng Bác Sĩ) - chưa có trong engine, thuộc P4/P6."
    noi_dung_nhay_cam: false
    ghi_chu: ""
  - ma: 8
    ten: "Luận Nam Nữ Mệnh"
    ly_do: "Phân biệt giới + luận phẩm hạnh; cần duyệt nội dung trước khi dùng."
    noi_dung_nhay_cam: true
    ghi_chu: "Chứa luận phẩm hạnh/phân biệt giới - P2 §4.5."
  - ma: 9
    ten: "Phân loại 10 loại Mệnh"
    ly_do: "Phân nhóm 10 loại mệnh theo tổ hợp sao; chưa tách điều kiện nhận diện rõ."
    noi_dung_nhay_cam: false
    ghi_chu: ""
  - ma: 10
    ten: "Các cách Nghề nghiệp"
    ly_do: "Diễn giải nghề nghiệp theo tổ hợp; chưa tách điều kiện, cần duyệt nội dung."
    noi_dung_nhay_cam: false
    ghi_chu: ""
